name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to GoDaddy cPanel
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read

    steps:
      - name: Download deploy bundle from CI run
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Upload bundle to GoDaddy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.CPANEL_SSH_HOST }}
          username: ${{ vars.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          port: ${{ vars.CPANEL_SSH_PORT }}
          source: "deploy.tar.gz"
          target: "/home/mahamudr/"

      - name: Extract and restart on GoDaddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.CPANEL_SSH_HOST }}
          username: ${{ vars.CPANEL_SSH_USER }}
          key: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          port: ${{ vars.CPANEL_SSH_PORT }}
          script: |
            set -e
            cd /home/mahamudr
            mkdir -p release-new
            tar -xzf deploy.tar.gz -C release-new
            rm deploy.tar.gz

            cd new.mahamudra.com
            rm -rf .next node_modules
            cd ..
            cp -a release-new/. new.mahamudra.com/
            rm -rf release-new

            mkdir -p new.mahamudra.com/tmp
            touch new.mahamudra.com/tmp/restart.txt
            
            # set -e
            # cd /home/mahamudr/new.mahamudra.com

            # rm -rf .next node_modules

            # tar -xzf /home/mahamudr/deploy.tar.gz -C /home/mahamudr/new.mahamudra.com
            # rm /home/mahamudr/deploy.tar.gz

            # mkdir -p tmp
            # touch tmp/restart.txt

      - name: Deployment summary
        run: echo "Deployed commit ${{ github.event.workflow_run.head_sha }} to new.mahamudra.com"