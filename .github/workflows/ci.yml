name: Next.js CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify environment variables
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is missing"
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is missing"
            exit 1
          fi

          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "CLERK_SECRET_KEY is missing"
            exit 1
          fi

          echo "Required environment variables are available."
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DIRECT_URL: ${{ vars.DIRECT_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ vars.CLERK_SECRET_KEY }}

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DIRECT_URL: ${{ vars.DIRECT_URL }}

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test --if-present

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DIRECT_URL: ${{ vars.DIRECT_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ vars.CLERK_SECRET_KEY }}
          
      # From here on, only runs for main — develop/PR builds stop above,
      # since there's nothing to deploy for those.
      - name: Strip node_modules down to production-only
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm prune --omit=dev

      - name: Package the deployable bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          tar -czf deploy.tar.gz \
            .next \
            node_modules \
            public \
            prisma \
            package.json \
            package-lock.json \
            next.config.mjs \
            server.js

      - name: Upload deploy bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy.tar.gz
          retention-days: 1          